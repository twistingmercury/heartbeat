services:
  cassandra:
    image: cassandra:5.0@sha256:618a493bcf1f817ea2f07288a46fa76fb2d9c4dfd5a04c28227336405782889c
    environment:
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s
    networks:
    - e2e_network

  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
    - e2e_network

  testapi:
    build:
      context: ..
      dockerfile: tests/testApi/Dockerfile
    environment:
      - CASSANDRA_HOST=cassandra
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      cassandra:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
    - e2e_network

  # E2E test runner
  e2e_tests:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    environment:
      - TESTAPI_URL=http://testapi:8080
    depends_on:
      testapi:
        condition: service_healthy
    networks:
      - e2e_network

networks:
  e2e_network:
    driver: bridge
